    <!-- Theme init: runs before render to prevent flash of wrong theme -->
    <script>
      (function () {
        try {
          // Public-facing pages are always light; workspace routes may use a
          // learner's saved theme preference.
          var isWorkspaceRoute = /^\/(app|admin|teacher)(?:\/|$)/.test(window.location.pathname);
          if (!isWorkspaceRoute) {
            document.documentElement.classList.add('light');
            return;
          }

          var theme = localStorage.getItem('purelearn-theme') || 'light';
          var validThemes = ['light', 'dark', 'system', 'low-light'];
          if (!validThemes.includes(theme)) theme = 'light';

          var el = document.documentElement;
          el.classList.remove('light', 'dark', 'low-light');

          if (theme === 'system') {
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            el.classList.add(prefersDark ? 'dark' : 'light');
          } else {
            el.classList.add(theme);
          }
        } catch (e) {
          // If localStorage is unavailable, default to light mode silently
          document.documentElement.classList.add('light');
        }
      })();
    </script>
